reconfigure:
  name: Reconfigure ZHA device
  description: >-
    Run a ZHA device reconfigure, retrying on failure, and return the resulting
    status (complete, incomplete, timeout or unavailable). Works on a single
    device, or on all ZHA devices except the coordinator.
  fields:
    device_id:
      name: Device
      description: >-
        The ZHA device to reconfigure. Required unless "All devices" is turned
        on.
      required: false
      selector:
        device:
          filter:
            - integration: zha
    all_devices:
      name: All devices
      description: >-
        Reconfigure every ZHA device except the coordinator, one after another,
        continuing with the next device whatever the previous one reported.
        Cannot be combined with a device. Only one batched run (reconfigure,
        re-interview, ping, frame counter or route query) can be in progress at a
        time.
      required: false
      example: true
      selector:
        boolean:
    timeout:
      name: Timeout
      description: >-
        Per-attempt timeout in seconds. Defaults to the configured value.
      required: false
      example: 20
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box
    max_retries:
      name: Maximum retries
      description: >-
        Maximum number of retries after the first attempt. Defaults to the
        configured value.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    retry_delay:
      name: Retry delay
      description: >-
        Seconds to wait between attempts. Defaults to the configured value.
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

reinterview:
  name: Re-interview ZHA device
  description: >-
    Re-interview a ZHA device in place (rediscover its endpoints and clusters)
    without removing it from the network, retrying on failure, and return the
    resulting status (complete, timeout or unavailable). Safe: the device never
    leaves the network, so it cannot be stranded. Works on a single device, or
    on all ZHA devices except the coordinator.
  fields:
    device_id:
      name: Device
      description: >-
        The ZHA device to re-interview. Required unless "All devices" is turned
        on.
      required: false
      selector:
        device:
          filter:
            - integration: zha
    all_devices:
      name: All devices
      description: >-
        Re-interview every ZHA device except the coordinator, one after
        another, continuing with the next device whatever the previous one
        reported. Cannot be combined with a device. Only one batched run
        (reconfigure, re-interview, ping, frame counter or route query) can be in progress at a
        time.
      required: false
      example: true
      selector:
        boolean:
    timeout:
      name: Timeout
      description: >-
        Per-attempt timeout in seconds. Defaults to the configured value.
      required: false
      example: 20
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box
    max_retries:
      name: Maximum retries
      description: >-
        Maximum number of retries after the first attempt. Defaults to the
        configured value.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    retry_delay:
      name: Retry delay
      description: >-
        Seconds to wait between attempts. Defaults to the configured value.
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

ping:
  name: Ping ZHA device
  description: >-
    Check that a ZHA device answers, retrying on failure, and return the
    resulting status (complete, timeout or unavailable). Also pings devices ZHA
    currently marks unavailable, so an answer brings them back; before the
    first retry, the device's network address is looked up once. Safe: the
    device is only read from. Works on a single device, or on all ZHA devices
    except the coordinator.
  fields:
    device_id:
      name: Device
      description: >-
        The ZHA device to ping. Required unless "All devices" is turned on.
      required: false
      selector:
        device:
          filter:
            - integration: zha
    all_devices:
      name: All devices
      description: >-
        Ping every ZHA device except the coordinator, one after another,
        continuing with the next device whatever the previous one reported.
        Cannot be combined with a device. Only one batched run (reconfigure,
        re-interview, ping, frame counter or route query) can be in progress at a
        time.
      required: false
      example: true
      selector:
        boolean:
    timeout:
      name: Timeout
      description: >-
        Seconds to wait for the device to answer each ping. Defaults to the
        configured value.
      required: false
      example: 20
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box
    max_retries:
      name: Maximum retries
      description: >-
        Maximum number of retries after the first attempt. Defaults to the
        configured value.
      required: false
      example: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    retry_delay:
      name: Retry delay
      description: >-
        Seconds to wait between attempts. Defaults to the configured value.
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

frame_counter:
  name: Read ZHA device frame counter
  description: >-
    Read the incoming network (NWK) frame counter the coordinator stores for a
    ZHA device, together with the time it was last seen, and return them. Helps
    find the devices behind rising frame counter failures: a device that keeps
    being seen while its counter stays the same is having its frames dropped.
    Only direct neighbors of the coordinator have a counter; other devices are
    reported as not_neighbor. Needs a Silicon Labs (EZSP) radio. Safe: only
    the coordinator's radio is queried. Works on a single device, or on all ZHA
    devices except the coordinator.
  fields:
    device_id:
      name: Device
      description: >-
        The ZHA device to read the frame counter for. Required unless "All
        devices" is turned on.
      required: false
      selector:
        device:
          filter:
            - integration: zha
    all_devices:
      name: All devices
      description: >-
        Read the frame counter of every ZHA device except the coordinator.
        Cannot be combined with a device. Only one batched run (reconfigure,
        re-interview, ping, frame counter or route query) can be in progress at a
        time.
      required: false
      example: true
      selector:
        boolean:

query_route:
  name: Query ZHA device route
  description: >-
    Report everything the coordinator knows about the route between it and a
    ZHA device, naming each hop by its network (NWK) address and display name:
    the path of the device's last route record, the radio's source route and
    route table entry, the path rebuilt from the last topology scan, the
    device's parents and the routers that hear it. Safe: nothing is sent over
    the air. Radio tables are only read from Silicon Labs (EZSP) radios. Works
    on a single device, or on all ZHA devices except the coordinator.
  fields:
    device_id:
      name: Device
      description: >-
        The ZHA device to query the route for. Required unless "All devices"
        is turned on.
      required: false
      selector:
        device:
          filter:
            - integration: zha
    all_devices:
      name: All devices
      description: >-
        Query the route of every ZHA device except the coordinator. Cannot be
        combined with a device. Only one batched run (reconfigure,
        re-interview, ping, frame counter or route query) can be in progress at
        a time.
      required: false
      example: true
      selector:
        boolean:

retry_action:
  name: Call action reliably
  description: >-
    Call another action, e.g. climate.set_temperature or cover.close_cover,
    and keep repeating it until it goes through or the timeout runs out,
    waiting longer after each failed attempt (slow exponential backoff). For
    ZHA entities an attempt succeeds once the device has acknowledged the
    command; while a targeted entity is unavailable, the action is not called
    and the attempt counts as failed. Only wrap actions that can safely run
    more than once (set a value, not toggle it). Invalid calls and ZHA Tools
    actions are not retried. Returns the status (complete or timeout), the
    number of attempts and the last error.
  fields:
    action:
      name: Action
      description: The action to call, as domain.action.
      required: true
      example: cover.close_cover
      selector:
        text:
    target:
      name: Target
      description: >-
        The target of the action (entity_id, device_id, area_id), as for a
        regular action call.
      required: false
      example: '{"entity_id": "cover.living_room_blind"}'
      selector:
        object:
    data:
      name: Data
      description: The data for the action, as for a regular action call.
      required: false
      example: '{"temperature": 21}'
      selector:
        object:
    metadata:
      name: Metadata
      description: >-
        Passed on to the action inside its data, as the "metadata" entry.
        Entity actions ignore it; actions with a strict schema reject the call.
      required: false
      example: '{}'
      selector:
        object:
    timeout:
      name: Timeout
      description: >-
        Overall time limit in seconds for all attempts and the waits between
        them.
      required: false
      default: 600
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          unit_of_measurement: seconds
          mode: box
    attempt_timeout:
      name: Attempt timeout
      description: Time limit in seconds for a single attempt.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 600
          step: 1
          unit_of_measurement: seconds
          mode: box
    retry_delay:
      name: Initial retry delay
      description: Seconds to wait after the first failed attempt.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          unit_of_measurement: seconds
          mode: box
    backoff:
      name: Backoff factor
      description: >-
        Factor the delay is multiplied by after each failed attempt. 1 keeps
        the delay constant; 1.5 gives a slow exponential backoff.
      required: false
      default: 1.5
      selector:
        number:
          min: 1
          max: 10
          step: 0.1
          mode: box
    max_delay:
      name: Maximum retry delay
      description: Upper limit in seconds for the delay between attempts.
      required: false
      default: 120
      selector:
        number:
          min: 1
          max: 3600
          step: 1
          unit_of_measurement: seconds
          mode: box

rejoin:
  name: "DANGER: rejoin ZHA device"
  description: >-
    Ask a ZHA device to leave the network and immediately rejoin it (a remote
    substitute for pressing the pairing button). DANGER: if the device firmware
    does not honour the rejoin flag it will leave the network and NOT come back,
    and will then need a manual re-pair. Not retried; only sent to a reachable
    device. Prefer "Re-interview ZHA device" unless a full rejoin is truly
    needed.
  fields:
    device_id:
      name: Device
      description: The ZHA device to ask to leave and rejoin.
      required: true
      selector:
        device:
          filter:
            - integration: zha
    confirm:
      name: Confirm
      description: >-
        Must be set to true to actually run the rejoin. A safety acknowledgement
        that the device may leave the network and need a manual re-pair; the
        action refuses to run otherwise.
      required: true
      example: true
      selector:
        boolean:
    rejoin_wait:
      name: Rejoin wait
      description: >-
        Seconds to wait for the device to return before reporting. 0 returns
        immediately after sending the request without checking the outcome.
      required: false
      example: 60
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: seconds
          mode: box
