[project]
name = "zha-tools"
version = "0.6.1"
description = "Home Assistant custom integration offering a collection of helper actions for ZHA devices, starting with a reconfigure helper."
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Marc-André Lemburg", email = "mal@egenix.com" },
    { name = "eGenix.com Software, Skills and Services GmbH" },
]
# Home Assistant provides all runtime dependencies, so the integration itself
# has none of its own.
dependencies = []

[dependency-groups]
# Development-only dependencies. These are unpinned so uv can resolve a
# consistent, mutually compatible set together with Home Assistant.
dev = [
    "homeassistant",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "prek",
    "pytest-timeout",
    "ruff",
]

[tool.uv]
# This is a Home Assistant custom_components folder, not a pip-installable
# package, so uv must not attempt to build or install the project itself.
package = false
# Ignore package releases newer than this timestamp (~14 days before the
# project date) to mitigate supply-chain risk from freshly published versions.
exclude-newer = "2026-06-06T00:00:00Z"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# T10 flags debugger imports and breakpoint() calls (the "debug-statements" check).
extend-select = ["T10"]
ignore = ["E501", "E712", "N", "F841", "E402", "F811", "E741", "E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
# Safety net so a hung test fails instead of blocking the suite / CI.
timeout = 10
